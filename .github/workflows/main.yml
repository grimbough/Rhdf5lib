on:
  workflow_dispatch:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel

name: R-CMD-check

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.bioc-version }})

    strategy:
      fail-fast: false
      matrix:
        config:
        - { os: windows-2025,     bioc-version: 'devel', Ncpus: 4, cache: 1}
        - { os: windows-11-arm,   bioc-version: 'devel', Ncpus: 4, cache: 2}
        - { os: macOS-15-intel,   bioc-version: 'devel', Ncpus: 4, cache: 1}
        - { os: macOS-15,         bioc-version: 'devel', Ncpus: 3, cache: 2}
        - { os: ubuntu-24.04,     bioc-version: 'devel', Ncpus: 4, system-libs: 'libcurl4-gnutls-dev libaec-dev', cache: 1}
        - { os: ubuntu-24.04,     bioc-version: 'devel', Ncpus: 4, system-libs: 'libcurl4-openssl-dev', cache: 1}
        - { os: ubuntu-24.04-arm, bioc-version: 'devel', Ncpus: 4, cache: 2}

    steps:
      - name: Install Linux system libraries
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update && sudo apt-get install ${{ matrix.config.system-libs }}
        
      - uses: actions/checkout@v6
          
      - name: Setup R and Bioconductor
        uses: grimbough/bioc-actions/setup-bioc@v1
        with:
          bioc-version: ${{ matrix.config.bioc-version }}
          bioc-mirror: https://ftp.gwdg.de/pub/misc/bioconductor
          Ncpus: ${{ matrix.config.Ncpus }}

      - name: Install Mac system libraries
        if: ${{ matrix.config.os == 'macOS-15' }}
        run: |
          source("https://mac.R-project.org/bin/install.R")
          install.libs("openssl")
        shell: Rscript {0}
          
      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # We use cache versioning to differentiate between Intel and ARM macOS builds
          # https://github.com/r-lib/actions/issues/1035
          cache-version: ${{ matrix.config.cache }}
          extra-packages: |
            bioc::BiocCheck
      
      - name: Work around https://github.com/grimbough/bioc-actions/issues/18
        uses: r-lib/actions/setup-tinytex@v2
        
      - name: Bioc - Build, Install, Check
        id: build-install-check
        uses: grimbough/bioc-actions/build-install-check@v1
        
      - name: Run BiocCheck
        uses: grimbough/bioc-actions/run-BiocCheck@v1
        with:
          error-on: 'never'
          arguments: '--no-check-bioc-help' 
        
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Avoid name clashes when running multiple checks with the same os
          name: ${{ matrix.config.os }}-${{ job.check_run_id }}-hdf5_config.log
          path: ${{ steps.build-install-check.outputs.check-dir }}

      - name: Upload check results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.os }}-${{ matrix.config.r }}-hdf5_config.log
          path: check/*.Rcheck/00_pkg_src/Rhdf5lib/src/hdf5/config.log
